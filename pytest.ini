[pytest]
# Tests live in tests/; source is imported via tests/conftest.py (adds src/ to path).
testpaths = tests
python_files = test_*.py
python_functions = test_*

# Real-LLM tests (tests/llm/) cost money and need API keys. They are OPT-IN:
# a normal `pytest` run deselects them. Run them deliberately with `-m llm`.
addopts = -m "not llm" -ra
markers =
    llm: hits a real LLM provider — costs money, needs API keys, slow (opt-in; run with `-m llm`)
